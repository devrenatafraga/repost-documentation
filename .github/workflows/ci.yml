name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ADR index links exist
        run: |
          set -e
          for f in docs/adr/0001-*.md docs/adr/0002-*.md docs/adr/0003-*.md docs/adr/0004-*.md docs/adr/0005-*.md; do
            test -f "$f"
          done
          test -f docs/adr/index.md
          test -f backlog/wave-1.yaml
